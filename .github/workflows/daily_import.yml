        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHAINS_TO_SCRAPE: "TIV_TAAM,YOHANANOF,VICTORY_NEW_SOURCE"
        run: python scripts/import_kaggle.py

  petites_chaines:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install il-supermarket-scraper supabase python-dotenv openai
      - name: Scrape petites chaînes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHAINS_TO_SCRAPE: "BAREKET,CITY_MARKET_SHOPS,GOOD_PHARM,HAZI_HINAM,KESHET,KING_STORE,MAAYAN2000,MAHSANI_ASHUK_NEW_SOURCE,NETIV_HASED,OSHER_AD,POLIZER,SALACH_DABACH,SHEFA_BARCART_ASHEM,SHUK_AHIR,STOP_MARKET,SUPER_SAPIR,SUPER_YUDA,ZOL_VEBEGADOL,FRESH_MARKET_AND_SUPER_DOSH,CITY_MARKET"
        run: python scripts/import_kaggle.py

  traduction:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [shufersal, super_pharm, yeinot_bitan, rami_levy, dor_alon_yellow, tiv_taam_yohananof_victory, petites_chaines]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openai supabase python-dotenv
      - name: Traduire produits non traduits
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/translate.py
