name: Import quotidien des prix Kamaz
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  shufersal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install il-supermarket-scraper supabase python-dotenv openai
      - name: Scrape Shufersal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHAINS_TO_SCRAPE: "SHUFERSAL"
        run: python scripts/import_kaggle.py

  super_pharm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install il-supermarket-scraper supabase python-dotenv openai
      - name: Scrape Super Pharm
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHAINS_TO_SCRAPE: "SUPER_PHARM"
        run: python scripts/import_kaggle.py

  yeinot_bitan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install il-supermarket-scraper supabase python-dotenv openai
      - name: Scrape Yeinot Bitan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHAINS_TO_SCRAPE: "YEINOT_BITAN"
        run: python scripts/import_kaggle.py

  rami_levy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install il-supermarket-scraper supabase python-dotenv openai
      - name: Scrape Rami Levy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHAINS_TO_SCRAPE: "RAMI_LEVY"
        run: python scripts/import_kaggle.py

  dor_alon_yellow:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install il-supermarket-scraper supabase python-dotenv openai
      - name: Scrape Dor Alon + Yellow
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHAINS_TO_SCRAPE: "DOR_ALON,YELLOW"
        run: python scripts/import_kaggle.py

  tiv_taam_yohananof_victory:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
