name: Import quotidien des prix Kamaz
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  shufersal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install il-supermarket-scraper supabase python-dotenv openai
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHAINS_TO_SCRAPE: "SHUFERSAL"
        run: python scripts/import_kaggle.py

